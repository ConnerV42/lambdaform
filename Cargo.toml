[package]
name = "lambdaform"
version = "0.5.0"
edition = "2021"
description = "Terraform-native local Lambda emulator"
license = "MIT"
repository = "https://github.com/connerverret/lambdaform"
keywords = ["aws", "lambda", "terraform", "serverless", "local-development"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Encoding
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP Server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HCL Parsing
hcl-rs = "0.18"

# File watching
notify = "6"
notify-debouncer-mini = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# WebSocket
tokio-tungstenite = "0.24"

# Utilities
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
regex = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
http-body-util = "0.1"
tower_05 = { package = "tower", version = "0.5", features = ["util"] }

[lib]
name = "lambdaform"
path = "src/lib.rs"

[[bin]]
name = "lambdaform"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
