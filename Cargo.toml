[package]
name = "lambdaform"
version = "1.0.2"
edition = "2021"
description = "Terraform-native local Lambda emulator"
license = "MIT"
repository = "https://github.com/connerverret/lambdaform"
keywords = ["aws", "lambda", "terraform", "serverless", "local-development"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Encoding
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"

# HTTP Server
axum = "0.7"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HCL Parsing
hcl-rs = "0.18"

# File watching
notify = "6"
notify-debouncer-mini = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async utilities
futures = "0.3"

# WebSocket
tokio-tungstenite = "0.24"

# Terminal UI (optional)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# Utilities
anyhow = "1"
bollard = "0.18"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
clap_complete = "4"
libc = "0.2"
thiserror = "1"
regex = "1"
walkdir = "2"
which = "7"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tower_05 = { package = "tower", version = "0.5", features = ["util"] }

[lib]
name = "lambdaform"
path = "src/lib.rs"

[[bin]]
name = "lambdaform"
path = "src/main.rs"

[features]
default = []
tui = ["ratatui", "crossterm"]

[profile.release]
lto = true
strip = true
