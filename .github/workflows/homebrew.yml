name: Update Homebrew Formula

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets and compute SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          for asset in lambdaform-macos-aarch64.tar.gz lambdaform-macos-x86_64.tar.gz lambdaform-linux-x86_64.tar.gz; do
            gh release download "$GITHUB_REF_NAME" -p "$asset" -D /tmp/assets/
            SHA=$(sha256sum "/tmp/assets/$asset" | cut -d' ' -f1)
            KEY=$(echo "$asset" | sed 's/lambdaform-//;s/.tar.gz//;s/-/_/g' | tr '[:lower:]' '[:upper:]')
            echo "SHA_${KEY}=$SHA" >> $GITHUB_ENV
            echo "$asset: $SHA"
          done

      - name: Update formula
        run: |
          FORMULA=Formula/lambdaform.rb
          sed -i "s/version \".*\"/version \"$VERSION\"/" "$FORMULA"
          sed -i "s/PLACEHOLDER_MACOS_AARCH64/$SHA_MACOS_AARCH64/" "$FORMULA"
          sed -i "s/PLACEHOLDER_MACOS_X86_64/$SHA_MACOS_X86_64/" "$FORMULA"
          sed -i "s/PLACEHOLDER_LINUX_X86_64/$SHA_LINUX_X86_64/" "$FORMULA"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lambdaform.rb
          git diff --cached --quiet || git commit -m "brew: update formula to v$VERSION"
          git push
