# Full Stack: Lambdaform + DynamoDB Local + S3 (LocalStack)
#
# Start services:   docker compose up -d
# Start Lambdaform: lambdaform start
#
# DynamoDB: http://localhost:8000
# S3 (LocalStack): http://localhost:4566

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  setup:
    image: amazon/aws-cli:latest
    depends_on:
      dynamodb-local:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Create DynamoDB table
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name uploads \
          --attribute-definitions AttributeName=id,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          2>/dev/null || echo "Table already exists"

        # Create S3 bucket
        aws s3 mb s3://uploads-bucket \
          --endpoint-url http://localstack:4566 \
          2>/dev/null || echo "Bucket already exists"

        echo "Setup complete"
