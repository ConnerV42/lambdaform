# Lambdaform + DynamoDB Local
#
# Start services:   docker compose up -d
# Start Lambdaform: lambdaform start
#
# Your Lambda functions can access DynamoDB at http://localhost:8000
# Set AWS_ENDPOINT_URL=http://localhost:8000 in your Terraform env vars.

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Optional: create tables on startup
  dynamodb-setup:
    image: amazon/aws-cli:latest
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name items \
          --attribute-definitions AttributeName=id,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          2>/dev/null || echo "Table 'items' already exists"
        echo "DynamoDB setup complete"
